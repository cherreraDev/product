#Server
server.port=8080

#Application name
spring.application.name=product

#Couchbase
spring.couchbase.connection-string=couchbase://localhost
spring.couchbase.username=carlos
spring.couchbase.password=secretos123
spring.data.couchbase.bucket-name=product-bucket

#Kafka
spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.group-id=product-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.listener.missing-topics-fatal=false

#Logging levels
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.chstore.product=DEBUG
